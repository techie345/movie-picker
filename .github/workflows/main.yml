name: Main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, build, and upload artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v7.0.2
        with:
          name: next-build
          path: .next/
          if-no-files-found: error
          retention-days: 7

